linters:
  enable:
    - gofmt
    - golint
    - govet
    - errcheck
    - staticcheck
    - gosimple
    - ineffassign
    - unconvert
    - misspell
    - gosec

linters-settings:
  golint:
    min-confidence: 0.8
  gofmt:
    simplify: true

run:
  deadline: 5m
  tests: true
  skip-dirs:
    - vendor/